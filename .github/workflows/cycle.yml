name: Alpaca Trader Bot Cycle

on:
  schedule:
    # Every 10 min, M-F, 9:25-16:05 ET (13:25-20:05 UTC)
    # Cycle takes ~5.5 min, 10-min buffer prevents overlap
    - cron: '*/10 13-20 * * 1-5'
  workflow_dispatch: # manual trigger

# Prevent overlapping runs
concurrency:
  group: alpaca-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cycle
        run: FORCE_CYCLE=1 python lib/snapshot.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          ALPACA_LIVE_TRADE: ${{ secrets.ALPACA_LIVE_TRADE }}

      - name: Commit reports
        run: |
          git config user.name "alpaca-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Cycle update [skip ci]"
            git push
          fi
