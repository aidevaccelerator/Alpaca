name: Alpaca Trader Bot Cycle

on:
  schedule:
    # Every 10 min, M-F, 9:25-16:05 ET (13:25-20:05 UTC)
    # Cycle takes ~5.5 min, 10-min buffer prevents overlap
    - cron: '*/10 13-20 * * 1-5'
  workflow_dispatch: # manual trigger

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cycle
        run: FORCE_CYCLE=1 python lib/snapshot.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          ALPACA_LIVE_TRADE: ${{ secrets.ALPACA_LIVE_TRADE }}
